<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Predicted XI Builder</title>
    <!-- Persoonlijke tool, bewust niet vindbaar/gelinkt vanuit de live site — geen OG/Twitter-card/
         canonical/JSON-LD zoals index.html, enkel noindex zodat zoekmachines dit nooit oppikken. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="theme-color" content="#2A1440" />
    <!-- Zelfde reden als in index.html: lettertype via <link> in de <head> i.p.v. een @import in een
         door React geïnjecteerde <style>, zodat het niet achteraan de kritieke keten hangt. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/predicted-xi/main.jsx"></script>
  </body>
</html>
